<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 780" font-family="'Inter', system-ui, sans-serif">
  <defs>
    <filter id="glass">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="canvas-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14142a"/>
      <stop offset="100%" stop-color="#1a1a30"/>
    </linearGradient>
    <linearGradient id="preview-img" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2a1a4a"/>
      <stop offset="30%" stop-color="#1a2a5a"/>
      <stop offset="60%" stop-color="#2a3a2a"/>
      <stop offset="100%" stop-color="#3a1a2a"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
    </pattern>
    <filter id="shadow-elevated">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="rgba(0,0,0,0.5)"/>
    </filter>
    <filter id="shadow-light">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Top Bar -->
  <rect x="0" y="0" width="1280" height="46" fill="#1e1e36"/>
  <line x1="0" y1="46" x2="1280" y2="46" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>

  <text x="20" y="30" fill="#b0b0cc" font-size="13" font-weight="600">Comfy</text>
  <text x="68" y="30" fill="#6b6bff" font-size="13" font-weight="600">UI</text>

  <!-- Menu items -->
  <g font-size="11" fill="#6a6a8a">
    <text x="110" y="30">Queue</text>
    <text x="168" y="30">Load</text>
    <text x="218" y="30">Save</text>
    <text x="268" y="30">View</text>
    <text x="318" y="30">Settings</text>
  </g>

  <!-- Queue button -->
  <rect x="1090" y="12" width="140" height="24" rx="5" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="1130" y="30" fill="#aaaacc" font-size="11" font-weight="500">Queue Prompt</text>

  <!-- Main area -->
  <rect x="0" y="46" width="1280" height="734" fill="url(#canvas-bg)"/>

  <!-- Grid overlay -->
  <rect x="260" y="46" width="1020" height="734" fill="url(#grid)"/>

  <!-- Sidebar -->
  <rect x="0" y="46" width="260" height="734" fill="#1a1a32"/>
  <line x1="260" y1="46" x2="260" y2="780" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

  <!-- Sidebar title -->
  <text x="16" y="74" fill="#5555aa" font-size="10" text-transform="uppercase" letter-spacing="1">Nodes</text>

  <!-- Sidebar items -->
  <g>
    <rect x="12" y="88" width="236" height="32" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="38" y="108" fill="#b0b0cc" font-size="11">◇ KSampler</text>
    <text x="200" y="108" fill="#6666aa" font-size="9">sampling</text>

    <rect x="12" y="126" width="236" height="32" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="38" y="146" fill="#b0b0cc" font-size="11">□ Empty Latent</text>
    <text x="200" y="146" fill="#6666aa" font-size="9">latent</text>

    <rect x="12" y="164" width="236" height="32" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="38" y="184" fill="#b0b0cc" font-size="11">◎ CLIP Text</text>
    <text x="200" y="184" fill="#6666aa" font-size="9">text</text>

    <rect x="12" y="202" width="236" height="32" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="38" y="222" fill="#b0b0cc" font-size="11">◉ VAE Decode</text>
    <text x="200" y="222" fill="#6666aa" font-size="9">decode</text>

    <rect x="12" y="240" width="236" height="32" rx="6" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <text x="38" y="260" fill="#b0b0cc" font-size="11">◆ Checkpoint</text>
    <text x="200" y="260" fill="#6666aa" font-size="9">model</text>
  </g>

  <!-- Graph Node: KSampler -->
  <g filter="url(#shadow-elevated)">
    <rect x="320" y="100" width="210" height="100" rx="8" fill="#252542" stroke="#4a4a8a" stroke-width="2"/>
    <rect x="320" y="100" width="210" height="34" rx="8" fill="#2a2a50"/>
    <rect x="320" y="126" width="210" height="8" fill="#2a2a50"/>
    <circle cx="340" cy="117" r="4" fill="#7c7cff"/>
    <text x="352" y="122" fill="#d0d0e8" font-size="12" font-weight="600">KSampler</text>

    <rect x="334" y="144" width="182" height="20" rx="4" fill="rgba(255,255,255,0.04)"/>
    <text x="342" y="158" fill="#8888b0" font-size="10">seed: 42424242</text>
    <rect x="334" y="168" width="182" height="20" rx="4" fill="rgba(255,255,255,0.04)"/>
    <text x="342" y="182" fill="#8888b0" font-size="10">steps: 20</text>
  </g>

  <!-- Graph Node: Empty Latent -->
  <g filter="url(#shadow-elevated)">
    <rect x="620" y="100" width="190" height="80" rx="8" fill="#252542" stroke="#4a6a4a" stroke-width="2"/>
    <rect x="620" y="100" width="190" height="34" rx="8" fill="#2a4a2a"/>
    <rect x="620" y="126" width="190" height="8" fill="#2a4a2a"/>
    <circle cx="640" cy="117" r="4" fill="#6aff6a"/>
    <text x="652" y="122" fill="#d0d0e8" font-size="12" font-weight="600">Empty Latent</text>
    <rect x="634" y="144" width="162" height="20" rx="4" fill="rgba(255,255,255,0.04)"/>
    <text x="642" y="158" fill="#8888b0" font-size="10">1024 × 1024</text>
  </g>

  <!-- Graph Node: Preview Image (running) -->
  <g filter="url(#shadow-elevated)">
    <rect x="470" y="300" width="190" height="80" rx="8" fill="#252542" stroke="#6a4a4a" stroke-width="2"/>
    <rect x="470" y="300" width="190" height="34" rx="8" fill="#4a2d2d"/>
    <rect x="470" y="326" width="190" height="8" fill="#4a2d2d"/>
    <circle cx="490" cy="317" r="4" fill="#ff6a6a"/>
    <text x="502" y="322" fill="#d0d0e8" font-size="12" font-weight="600">Preview Image</text>
    <text x="488" y="360" fill="#6a6acc" font-size="11">▶ Running...</text>
  </g>

  <!-- Connection wires -->
  <path d="M 530 134 L 620 134" stroke="rgba(120,120,255,0.2)" stroke-width="2" fill="none"/>
  <path d="M 530 140 L 620 140" stroke="rgba(120,120,255,0.15)" stroke-width="2" fill="none"/>
  <path d="M 620 180 L 565 320" stroke="rgba(120,120,255,0.15)" stroke-width="2" fill="none"/>
  <path d="M 810 134 L 890 134" stroke="rgba(120,255,120,0.15)" stroke-width="2" fill="none"/>

  <!-- Socket dots -->
  <circle cx="530" cy="134" r="5" fill="#6b6bff" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="620" cy="134" r="5" fill="#6b6bff" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
  <circle cx="530" cy="140" r="5" fill="#6b6bff" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>

  <!-- Loading indicator (bottom right) -->
  <rect x="1030" y="680" width="200" height="40" rx="8" fill="rgba(30,30,50,0.92)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <circle cx="1054" cy="700" r="7" fill="none" stroke="rgba(120,120,255,0.2)" stroke-width="2"/>
  <path d="M 1054 693 A 7 7 0 0 1 1061 700" stroke="#7c7cff" stroke-width="2" fill="none"/>
  <text x="1074" y="704" fill="#b0b0d0" font-size="12">Generating... (step 12/20)</text>

  <!-- === FLOATING PREVIEW PANEL (exact reproduction from code) === -->
  <g filter="url(#shadow-elevated)">
    <!-- Main container -->
    <rect x="300" y="200" width="340" height="320" rx="12" fill="rgba(20,20,25,0.7)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

    <!-- Inner highlight -->
    <rect x="301" y="201" width="338" height="1" rx="0" fill="rgba(255,255,255,0.08)"/>

    <!-- Header -->
    <rect x="300" y="200" width="340" height="38" rx="12" fill="rgba(30,30,35,0.88)"/>
    <rect x="300" y="228" width="340" height="10" fill="rgba(30,30,35,0.88)"/>
    <line x1="300" y1="238" x2="640" y2="238" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- Header: green pulse dot -->
    <circle cx="320" cy="219" r="4" fill="#00d26a"/>
    <circle cx="320" cy="219" r="8" fill="none" stroke="rgba(0,210,106,0.3)" stroke-width="1.5">
      <animate attributeName="r" values="4;10;4" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.7;0;0.7" dur="2s" repeatCount="indefinite"/>
    </circle>

    <!-- Header: title -->
    <text x="332" y="224" fill="#f3f3f3" font-size="13" font-weight="500" letter-spacing="0.5">Preview pro</text>

    <!-- Header: minimize button -->
    <rect x="572" y="210" width="28" height="22" rx="5" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="581" y="226" fill="#e0e0e0" font-size="11" font-weight="600" text-anchor="middle">−</text>

    <!-- Header: toggle ON button -->
    <rect x="606" y="210" width="24" height="22" rx="5" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="618" y="226" fill="#e0e0e0" font-size="10" font-weight="600" text-anchor="middle">ON</text>

    <!-- Content area -->
    <rect x="300" y="238" width="340" height="268" rx="0" fill="transparent"/>
    <rect x="300" y="510" width="340" height="10" rx="0" fill="transparent"/>

    <!-- Image in content -->
    <rect x="310" y="248" width="320" height="240" rx="6" fill="url(#preview-img)" filter="url(#shadow-light)"/>
    <rect x="310" y="248" width="320" height="240" rx="6" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- Decorative image content (abstract generated art) -->
    <g opacity="0.6">
      <circle cx="400" cy="340" r="60" fill="none" stroke="rgba(180,120,255,0.3)" stroke-width="2"/>
      <circle cx="460" cy="380" r="40" fill="none" stroke="rgba(255,120,180,0.25)" stroke-width="2"/>
      <circle cx="520" cy="330" r="35" fill="none" stroke="rgba(120,200,255,0.2)" stroke-width="2"/>
      <circle cx="370" cy="410" r="30" fill="none" stroke="rgba(120,255,180,0.2)" stroke-width="2"/>
      <path d="M 350 380 Q 420 310 500 370 Q 540 340 580 400" fill="none" stroke="rgba(255,200,100,0.2)" stroke-width="2"/>
      <path d="M 340 340 Q 380 290 460 340 Q 520 370 560 320" fill="none" stroke="rgba(180,180,255,0.15)" stroke-width="1.5"/>
      <circle cx="450" cy="350" r="3" fill="rgba(255,255,255,0.4)"/>
      <circle cx="420" cy="380" r="2" fill="rgba(255,255,255,0.3)"/>
      <circle cx="500" cy="360" r="2.5" fill="rgba(255,255,255,0.35)"/>
      <!-- Grain dots -->
      <circle cx="380" cy="320" r="1" fill="rgba(255,255,255,0.15)"/>
      <circle cx="430" cy="310" r="1" fill="rgba(255,255,255,0.1)"/>
      <circle cx="480" cy="430" r="1" fill="rgba(255,255,255,0.12)"/>
      <circle cx="540" cy="300" r="1" fill="rgba(255,255,255,0.08)"/>
    </g>

    <!-- Image label -->
    <text x="470" y="476" fill="rgba(255,255,255,0.2)" font-size="9" text-anchor="middle">preview_12.png — 1024×1024</text>

    <!-- Resize handle -->
    <rect x="624" y="506" width="14" height="14" rx="0" fill="transparent"/>
    <line x1="633" y1="517" x2="624" y2="508" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="637" y1="517" x2="628" y2="508" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="633" y1="513" x2="628" y2="508" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Canvas toolbar (bottom center) -->
  <rect x="460" y="730" width="360" height="34" rx="8" fill="rgba(30,30,50,0.9)" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <g font-size="10" fill="#5a5a8a">
    <text x="500" y="751">Zoom: 100%</text>
    <text x="600" y="751">Pan</text>
    <text x="660" y="751">Select</text>
    <text x="730" y="751">Fit</text>
  </g>

  <!-- Bottom safety bar -->
  <rect x="0" y="770" width="1280" height="10" fill="#1a1a30"/>
</svg>
